<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Markdown Runner</title>
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="popup-title">
        <img src="/icons/icon32.png" alt="" class="popup-logo">
        <span class="popup-name">Markdown Runner</span>
        <span class="popup-version" id="version">v1.0.0</span>
      </div>
      <label class="toggle-switch" title="Global toggle">
        <input type="checkbox" id="globalToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </header>

    <div class="popup-status">
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText"></span>
      </div>
      <div class="block-count" id="blockCount"></div>
    </div>

    <div class="popup-divider"></div>

    <ul class="feature-list" id="featureList">
      <li class="feature-item" data-feature="runner">
        <span class="feature-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
        <span class="feature-name" data-i18n="popup.features.runner">Code Runner</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="runner" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="copy">
        <span class="feature-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span>
        <span class="feature-name" data-i18n="popup.features.copy">One-Click Copy</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="copy" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="collapse">
        <span class="feature-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M7 18l5-5 5 5"/></svg></span>
        <span class="feature-name" data-i18n="popup.features.collapse">Code Folding</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="collapse" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="languageLabel">
        <span class="feature-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></span>
        <span class="feature-name" data-i18n="popup.features.languageLabel">Language Label</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="languageLabel" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="lineNumbers">
        <span class="feature-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16"/><path d="M4 12h16"/><path d="M4 20h16"/><circle cx="4" cy="4" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="20" r="1" fill="currentColor"/></svg></span>
        <span class="feature-name" data-i18n="popup.features.lineNumbers">Line Numbers</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="lineNumbers" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="diff">
        <span class="feature-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></svg></span>
        <span class="feature-name" data-i18n="popup.features.diff">Diff Mode</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="diff" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="toc">
        <span class="feature-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></span>
        <span class="feature-name" data-i18n="popup.features.toc">Floating TOC</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="toc" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="progressBar">
        <span class="feature-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="10" width="22" height="4" rx="2"/><rect x="1" y="10" width="14" height="4" rx="2" fill="currentColor" opacity="0.3"/></svg></span>
        <span class="feature-name" data-i18n="popup.features.progressBar">Reading Progress</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="progressBar" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
    </ul>

    <div class="popup-divider"></div>

    <footer class="popup-footer">
      <button class="footer-btn" id="btnSettings" title="Settings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> <span data-i18n="popup.settings">Settings</span></button>
      <button class="footer-btn" id="btnFeedback" title="Feedback"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> <span data-i18n="popup.feedback">Feedback</span></button>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
