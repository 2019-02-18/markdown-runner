<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Markdown Runner</title>
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="popup-title">
        <img src="/icons/icon32.png" alt="" class="popup-logo">
        <span class="popup-name">Markdown Runner</span>
        <span class="popup-version" id="version">v1.0.0</span>
      </div>
      <label class="toggle-switch" title="Global toggle">
        <input type="checkbox" id="globalToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </header>

    <div class="popup-status">
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText"></span>
      </div>
      <div class="block-count" id="blockCount"></div>
    </div>

    <div class="popup-divider"></div>

    <ul class="feature-list" id="featureList">
      <li class="feature-item" data-feature="runner">
        <span class="feature-icon">▶</span>
        <span class="feature-name" data-i18n="popup.features.runner">Code Runner</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="runner" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="copy">
        <span class="feature-icon">📋</span>
        <span class="feature-name" data-i18n="popup.features.copy">One-Click Copy</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="copy" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="collapse">
        <span class="feature-icon">📐</span>
        <span class="feature-name" data-i18n="popup.features.collapse">Code Folding</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="collapse" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="languageLabel">
        <span class="feature-icon">🏷</span>
        <span class="feature-name" data-i18n="popup.features.languageLabel">Language Label</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="languageLabel" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="lineNumbers">
        <span class="feature-icon">#</span>
        <span class="feature-name" data-i18n="popup.features.lineNumbers">Line Numbers</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="lineNumbers" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="diff">
        <span class="feature-icon">⇄</span>
        <span class="feature-name" data-i18n="popup.features.diff">Diff Mode</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="diff" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="toc">
        <span class="feature-icon">📑</span>
        <span class="feature-name" data-i18n="popup.features.toc">Floating TOC</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="toc" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
      <li class="feature-item" data-feature="progressBar">
        <span class="feature-icon">━</span>
        <span class="feature-name" data-i18n="popup.features.progressBar">Reading Progress</span>
        <label class="toggle-switch small">
          <input type="checkbox" data-feature-toggle="progressBar" checked>
          <span class="toggle-slider"></span>
        </label>
      </li>
    </ul>

    <div class="popup-divider"></div>

    <footer class="popup-footer">
      <button class="footer-btn" id="btnSettings" title="Settings">⚙ <span data-i18n="popup.settings">Settings</span></button>
      <button class="footer-btn" id="btnRate" title="Rate">⭐ <span data-i18n="popup.rate">Rate</span></button>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
